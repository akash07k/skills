name: skill-creator tests

on:
  push:
    branches: [main]
    paths:
      - "skills/skill-creator/**"
      - "tests/skill-creator/**"
      - ".github/workflows/skill-creator.yml"
  pull_request:
    paths:
      - "skills/skill-creator/**"
      - "tests/skill-creator/**"
      - ".github/workflows/skill-creator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tests/skill-creator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate skill
        run: python ..\..\skills\skill-creator\scripts\quick_validate.py ..\..\skills\skill-creator

      - name: Python tests
        run: python -m unittest discover -s . -p "test_*.py"

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: tests/skill-creator/package-lock.json

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps firefox chromium

      - name: Browser tests
        run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: tests/skill-creator/test-results/
          if-no-files-found: ignore
